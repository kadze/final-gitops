# Stands in for kadze-versus's "migrate" initContainer, but as a PreSync hook
# instead: runs once per sync (not once per Pod), and ArgoCD blocks the rest
# of the sync until this succeeds — no race between concurrent replicas.
apiVersion: batch/v1
kind: Job
metadata:
  name: hello-migration
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - sh
            - -c
            - echo "running migration..."; sleep 5; echo "migration complete"
