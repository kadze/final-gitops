# Targets the "http" Service port (80 -> containerPort 8080), not "https" —
# once server.insecure=true lands, that's the port actually speaking plain
# HTTP. team-gateway's HTTPS listener terminates TLS in front of this.
#
# shevtsov.click, not 312ubuntu.com: external-dns's domainFilters is
# shevtsov.click only, and the Gateway's HTTPS listener hostname is
# *.shevtsov.click — a 312ubuntu.com hostname would get neither DNS nor TLS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  parentRefs:
    - name: team-gateway
      namespace: platform-tools
  hostnames:
    - "argocd.shevtsov.click"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
