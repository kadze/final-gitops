apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: versus-frontend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:312school/kadze-versus.git
    targetRevision: main
    path: helm/versus-frontend
    helm:
      releaseName: versus-frontend
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: versus
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
