apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:312school/kadze-gitops.git
    targetRevision: main
    path: apps/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # No syncPolicy on purpose — Stage 2 is about seeing OutOfSync/Missing
  # and syncing by hand before we ever turn on automated + selfHeal.
