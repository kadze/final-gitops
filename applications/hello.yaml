apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: learning
  source:
    repoURL: git@github.com:312school/kadze-gitops.git
    targetRevision: main
    path: apps/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # Stage 3, experiment E part 2: prune now on. Resources removed from git
  # get deleted, not just left orphaned (compare against part 1's result).
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
