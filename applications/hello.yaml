apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:312school/kadze-gitops.git
    targetRevision: main
    path: apps/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Stage 3, experiment A: automated (git-driven) sync only. selfHeal comes
  # later on purpose, so drift-without-selfHeal (experiment B) is observable
  # before drift-with-selfHeal (experiment C).
  syncPolicy:
    automated: {}
