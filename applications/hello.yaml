apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:312school/kadze-gitops.git
    targetRevision: main
    path: apps/hello
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Stage 3, experiment C: selfHeal now on. Live drift (not just git changes)
  # gets corrected automatically. Compare against experiment B's result.
  syncPolicy:
    automated:
      selfHeal: true
